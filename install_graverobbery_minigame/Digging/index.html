<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏ Deep Dig</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0500;color:#e8c887;font-family:'Georgia',serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:10px;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.65)100%);
  pointer-events:none;
}
#app{
  width:min(820px,100%);
  background:linear-gradient(155deg,#130800,#0a0500);
  border:2px solid #30180a;border-radius:18px;overflow:hidden;
  box-shadow:0 0 70px rgba(140,60,8,.16),0 24px 60px rgba(0,0,0,.85),
             inset 0 1px 0 rgba(255,180,60,.07);
}
header{
  background:linear-gradient(90deg,#140800,#221100,#140800);
  border-bottom:1px solid #30180a;padding:9px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
h1{font-size:21px;color:#f0c040;text-shadow:0 0 18px rgba(240,192,64,.4);letter-spacing:2px;white-space:nowrap}
#hud-depth{font-size:12px;color:#b09050;flex:1;letter-spacing:1px;min-width:80px}
.energy-wrap{display:flex;align-items:center;gap:7px}
.energy-label{font-size:11px;color:#7a5020}
.energy-bar{
  width:110px;height:12px;background:#080400;
  border:1px solid #30180a;border-radius:6px;overflow:hidden;transition:box-shadow .25s;
}
#energy-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#e08020,#f0c040);transition:width .25s,background .3s}
.energy-text{font-size:11px;color:#c8a870;min-width:52px;text-align:right}
.timer-wrap{display:flex;align-items:center;gap:5px}
.timer-label{font-size:11px;color:#7a5020}
#timer-val{font-size:13px;font-weight:bold;min-width:42px;text-align:center;color:#e0c080;font-variant-numeric:tabular-nums}
#timer-val.warn{color:#ff7040;text-shadow:0 0 8px rgba(255,100,40,.5)}
#timer-val.crit{color:#ff4444;animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.65}}
#new-game-btn{
  background:linear-gradient(135deg,#5c280c,#321408);border:1px solid #9a7030;
  color:#f0c040;border-radius:6px;padding:6px 14px;font-size:11px;
  font-family:inherit;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
#new-game-btn:hover{background:linear-gradient(135deg,#7c3a18,#502010)}
#main{display:flex}
#canvas-wrap{position:relative;flex-shrink:0}
canvas{display:block;cursor:crosshair;outline:none}
#controls-hint{
  position:absolute;bottom:5px;left:0;right:0;text-align:center;
  font-size:9px;color:rgba(160,120,60,.38);pointer-events:none;letter-spacing:.5px;
}
#sidebar{
  flex:1;padding:12px;border-left:1px solid #231000;background:rgba(0,0,0,.2);
  display:flex;flex-direction:column;gap:10px;min-width:0;
}
.card{
  background:rgba(255,255,255,.022);border:1px solid #231000;
  border-radius:9px;padding:10px;
}
.card-title{
  font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#623a14;
  margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid #231000;
}
#score-val{font-size:30px;font-weight:bold;color:#f0c040;text-shadow:0 0 10px rgba(240,192,64,.22);line-height:1}
#score-sub{font-size:10px;color:#623a14;margin-top:3px}
#layer-name{font-size:13px;font-weight:bold;transition:color .4s}
#layer-desc{font-size:10px;color:#623a14;margin-top:3px}
.disc-card{flex:1;overflow:hidden;display:flex;flex-direction:column}
#discoveries{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#231000 transparent}
#discoveries::-webkit-scrollbar{width:3px}
#discoveries::-webkit-scrollbar-thumb{background:#231000;border-radius:2px}
.disc-item{
  display:flex;align-items:center;gap:6px;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.03);animation:sli .25s ease;
}
@keyframes sli{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.disc-icon{width:24px;height:24px;flex-shrink:0}
.disc-icon img{width:100%;height:100%;object-fit:contain;display:block}
.disc-name{flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc-count{font-size:10px;color:#623a14;flex-shrink:0}
.rc-common{color:#b0b0b0}.rc-uncommon{color:#66bb6a}.rc-rare{color:#42a5f5}
.rc-epic{color:#ce93d8}.rc-legendary{color:#ffa726}.rc-mythic{color:#FFD700}.rc-cursed{color:#ef5350}
#empty-disc{font-size:11px;color:#3a2008;padding:6px 0;font-style:italic}
#gameover{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:1000}
#gameover.show{display:flex}
.go-card{background:linear-gradient(155deg,#1e0e00,#120800);border:2px solid #f0c040;border-radius:18px;padding:36px 44px;text-align:center;max-width:90vw;box-shadow:0 0 60px rgba(240,192,64,.2)}
.go-title{font-size:26px;color:#f0c040;margin-bottom:6px}
.go-reason{font-size:14px;color:#9a7040;margin-bottom:16px}
.go-score{font-size:48px;font-weight:bold;color:#f0c040;line-height:1}
.go-detail{font-size:13px;color:#623a14;margin:14px 0 22px}
.go-btn{background:linear-gradient(135deg,#7a4010,#4a2008);border:1px solid #c09040;color:#f0c040;border-radius:10px;padding:11px 28px;font-size:13px;font-family:inherit;letter-spacing:1px;cursor:pointer}
.go-btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⛏ Deep Dig</h1>
    <div id="hud-depth">Surface</div>
    <div class="energy-wrap">
      <span class="energy-label">⚡</span>
      <div class="energy-bar" id="energy-bar"><div id="energy-fill"></div></div>
      <span class="energy-text" id="energy-text">221/221</span>
    </div>
    <div class="timer-wrap">
      <span class="timer-label">⏱</span>
      <span id="timer-val">0:45</span>
    </div>
    <button id="new-game-btn">New Expedition</button>
  </header>
  <div id="main">
    <div id="canvas-wrap">
      <canvas id="canvas" width="600" height="450"></canvas>
      <div id="controls-hint">WASD / arrows — move &amp; dig · Hit 0⚡ → regen past 25 to dig again · slow digs save ⚡</div>
    </div>
    <div id="sidebar">
      <div class="card">
        <div class="card-title">Score</div>
        <div id="score-val">0</div>
        <div id="score-sub">Depth: 0m · Best: 0m</div>
      </div>
      <div class="card">
        <div class="card-title">Current Layer</div>
        <div id="layer-name">Surface</div>
        <div id="layer-desc">Ready to dig</div>
      </div>
      <div class="card disc-card">
        <div class="card-title">Discoveries</div>
        <div id="discoveries"><div id="empty-disc">Nothing found yet…</div></div>
      </div>
    </div>
  </div>
</div>

<div id="gameover">
  <div class="go-card">
    <div class="go-title">⛏ Expedition Over</div>
    <div class="go-reason" id="go-reason"></div>
    <div class="go-score" id="go-score">0</div>
    <div class="go-detail" id="go-detail"></div>
    <button class="go-btn" id="go-btn">Dig Again</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════════════════
const COLS = 20, ROWS = 58, BS = 30;   // block size 30 px
const CW = COLS * BS;                   // canvas width  = 600
const CH = 450;                         // canvas height = 450
const VR = CH / BS;                     // visible rows  = 15
const LIGHT_R = 132;                    // torch radius px

// Block type indices
const B = { AIR:0, DIRT:1, GRAVEL:2, CLAY:3, STONE:4, HARD:5, BED:6 };

// Per-block: [baseColor, dig?, baseEnergyCost, particleColor] — actual spend uses rush multiplier when spamming
const BD = [
  ['#0d0700', false, 0, '#0d0700'  ],  // 0 AIR
  ['#6b3c16', true,  2, '#8a5425'  ],  // 1 DIRT
  ['#7a6a58', true,  5, '#9a8a70'  ],  // 2 GRAVEL
  ['#a85030', true,  5, '#c87050'  ],  // 3 CLAY
  ['#525060', true,  9, '#747288'  ],  // 4 STONE
  ['#323042', true, 13, '#504e64'  ],  // 5 HARD ROCK
  ['#181626', false, 0, '#181626'  ],  // 6 BEDROCK
];

const ENERGY_REGEN_PER_SEC = 7;
/** After stamina hits 0, you cannot dig again until energy is strictly above this value. */
const DIG_RECOVER_MIN = 25;
/** If the next action happens sooner than this (ms) after the last one, dig cost scales up toward RUSH_MAX_MULT. */
const RUSH_SLOW_MS = 320;
const RUSH_MAX_MULT = 3.4;
const ROUND_TIME_SEC = 45;

const LAYERS = [
  {maxRow:6,   name:'Topsoil',       color:'#b08858', desc:'Soft topsoil — ~2⚡ slow · burns faster if you rush'},
  {maxRow:13,  name:'Packed Earth',  color:'#a06840', desc:'Gravel/clay ~5⚡ slow · spamming digs costs more'},
  {maxRow:21,  name:'Clay & Gravel', color:'#c07850', desc:'Mixed deposits ~5⚡'},
  {maxRow:31,  name:'Stone Layer',   color:'#8080a8', desc:'Stone ~9⚡ slow · pace yourself to save stamina'},
  {maxRow:44,  name:'Hard Rock',     color:'#6070b0', desc:'Hard rock ~13⚡'},
  {maxRow:999, name:'Deep Rock',     color:'#5060c0', desc:'Deep strata — up to ~13⚡ base'},
];

// Treasure table — Bone, Dirt, Old Ring weighted up; rarer finds down (slightly boosted vs prior)
const T = [
  {id:'bone',             name:'Bone',            p:.309, pts:5,   r:'common'   },
  {id:'dirt',             name:'Dirt',            p:.466, pts:0,   r:'common'   },
  {id:'old_ring',         name:'Old Ring',        p:.162, pts:20,  r:'uncommon' },
  {id:'silver_coin',      name:'Silver Coin',     p:.031, pts:15,  r:'uncommon' },
  {id:'ruby',             name:'Ruby',            p:.008, pts:50,  r:'rare'     },
  {id:'emerald',          name:'Emerald',         p:.008, pts:50,  r:'rare'     },
  {id:'old_weapon',       name:'Old Weapon',      p:.007, pts:75,  r:'rare'     },
  {id:'gold_necklace',    name:'Gold Necklace',   p:.004, pts:100, r:'epic'     },
  {id:'diamond',          name:'Diamond',         p:.0026, pts:150, r:'epic'     },
  {id:'ancient_artifact', name:'Ancient Artifact',p:.0012, pts:300, r:'legendary'},
  {id:'cursed_skull',     name:'Cursed Skull',    p:.0008, pts:-50, r:'cursed'   },
  {id:'treasure_map',     name:'Treasure Map',    p:.0004, pts:500, r:'mythic'   },
];

const RC = {
  common:'#b0b0b0',uncommon:'#66bb6a',rare:'#42a5f5',
  epic:'#ce93d8',legendary:'#ffa726',mythic:'#FFD700',cursed:'#ef5350'
};

// Chance of finding anything per block type (slightly higher than before)
const FC = [0, .115, .148, .182, .225, .282, 0];

// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
let world, player, score, inv, maxDepth;
let camY = -0.5, camTarget = -0.5;       // rows (float, can be slightly negative)
let parts = [];                           // particles
let notif = null, notifAge = 0;           // in-canvas find notification
let flash = 0, flashCol = '#fff';         // screen flash for legendary+
let energyAcc = 0;                        // energy regen accumulator
let lastTs = 0;
let gameActive = true;
let timeLeft = ROUND_TIME_SEC;
/** After energy reaches 0, digs stay locked until regen pushes energy above DIG_RECOVER_MIN. */
let energyDepleted = false;
/** Set after any successful step (air or dig); short gaps → higher dig cost. */
let lastActionTime = -1e9;

// Canvas / contexts
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
const lCvs = document.createElement('canvas'); lCvs.width = CW; lCvs.height = CH;
const lCtx = lCvs.getContext('2d');

// Pre-load treasure SVGs
const IMGS = {};
T.filter(t => t.id !== 'dirt').forEach(t => {
  const i = new Image(); i.src = `./svg/${t.id}.svg`; IMGS[t.id] = i;
});

// ═══════════════════════════════════════════════════════════════════════════════
// AUDIO (Web Audio synthesised sounds)
// ═══════════════════════════════════════════════════════════════════════════════
let actx;
function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}

function playDig(btype) {
  try {
    ensureAudio();
    const now = actx.currentTime;
    const len = actx.sampleRate * 0.07;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(); src.buffer = buf;
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = btype >= B.STONE ? 480 : 780;
    const g = actx.createGain(); g.gain.value = 0.2;
    src.connect(lp); lp.connect(g); g.connect(actx.destination); src.start(now);
  } catch(e) {}
}

function playFind(rarity) {
  try {
    ensureAudio();
    const now = actx.currentTime;
    const SEQ = {
      common:    [[440,.00,.18,'sine']],
      uncommon:  [[440,.00,.12,'sine'],[550,.13,.18,'sine']],
      rare:      [[440,.00,.10,'sine'],[550,.11,.10,'sine'],[660,.22,.24,'sine']],
      epic:      [[440,.00,.09,'triangle'],[550,.09,.09,'triangle'],[660,.18,.09,'triangle'],[880,.27,.32,'triangle']],
      legendary: [[440,.00,.08,'square'],[550,.09,.08,'square'],[660,.18,.08,'square'],[880,.27,.08,'square'],[1100,.36,.42,'square']],
      mythic:    [[330,.00,.07,'sawtooth'],[440,.08,.07,'sawtooth'],[550,.16,.07,'sawtooth'],[660,.24,.07,'sawtooth'],[880,.32,.07,'sawtooth'],[1100,.40,.07,'sawtooth'],[1320,.48,.55,'sawtooth']],
      cursed:    [['sw',.00,.65,'sawtooth']],
    };
    (SEQ[rarity] || SEQ.common).forEach(([freq, delay, dur, type]) => {
      const osc = actx.createOscillator(); osc.type = type;
      if (freq === 'sw') { osc.frequency.setValueAtTime(210, now+delay); osc.frequency.exponentialRampToValueAtTime(38, now+delay+dur); }
      else osc.frequency.value = freq;
      const g = actx.createGain();
      g.gain.setValueAtTime(0, now+delay);
      g.gain.linearRampToValueAtTime(rarity==='mythic' ? .10 : .14, now+delay+.025);
      g.gain.exponentialRampToValueAtTime(.001, now+delay+dur);
      osc.connect(g); g.connect(actx.destination);
      osc.start(now+delay); osc.stop(now+delay+dur+.05);
    });
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════════════════
// WORLD GENERATION
// ═══════════════════════════════════════════════════════════════════════════════
function blockAt(row, col) {
  if (row === 0) return B.AIR;
  if (row >= ROWS - 2) return B.BED;
  // Deterministic noise via sin-hash
  const h1 = Math.sin(col * 127.1 + row * 311.7) * 43758.5453;
  const h2 = Math.sin(col * 269.5 + row * 183.3) * 12345.678;
  const n1 = h1 - Math.floor(h1);  // 0–1
  const n2 = h2 - Math.floor(h2);
  // Small cave pockets
  if (n2 < 0.030 && row > 3 && row < ROWS - 4) return B.AIR;
  if (row <= 5)  return n1 < .15 ? B.GRAVEL : B.DIRT;
  if (row <= 12) { if(n1<.12)return B.GRAVEL; if(n1<.22)return B.CLAY; return B.DIRT; }
  if (row <= 21) { if(n1<.35)return B.STONE; if(n1<.48)return B.GRAVEL; if(n1<.58)return B.CLAY; return B.DIRT; }
  if (row <= 35) { return n1 < .18 ? B.HARD : B.STONE; }
  return n1 < .38 ? B.HARD : B.STONE;
}

function genWorld() {
  world = Array.from({length:ROWS}, (_, row) =>
    Array.from({length:COLS}, (_, col) => ({
      type: blockAt(row, col),
      orig: 0,                      // original type (for particle colours)
      v: Math.random() * 65535 | 0, // variation seed for texture
    }))
  );
  world.forEach(r => r.forEach(c => c.orig = c.type));
  // Clear a small starting shaft so player has air to start in
  for (let c = 9; c <= 11; c++) world[1][c].type = B.AIR;
}

// ═══════════════════════════════════════════════════════════════════════════════
// TREASURE ROLL
// ═══════════════════════════════════════════════════════════════════════════════
function rollTreasure(btype, row) {
  if (Math.random() > FC[btype]) return null;
  const df = Math.min(row / 36, 1); // depth factor 0→1
  const wt = T.map(t => {
    let p = t.p;
    if (t.r==='mythic')    p *= (1 + df * 10);
    if (t.r==='legendary') p *= (1 + df * 6);
    if (t.r==='epic')      p *= (1 + df * 3.5);
    if (t.r==='rare')      p *= (1 + df * 1.8);
    return {...t, p};
  });
  const tot = wt.reduce((s,t) => s + t.p, 0);
  let r = Math.random() * tot, cum = 0;
  for (const t of wt) { cum += t.p; if (r <= cum) return t; }
  return wt.at(-1);
}

// ═══════════════════════════════════════════════════════════════════════════════
// INPUT / MOVEMENT
// ═══════════════════════════════════════════════════════════════════════════════
const DIR = {
  ArrowUp:{dx:0,dy:-1}, w:{dx:0,dy:-1}, W:{dx:0,dy:-1},
  ArrowDown:{dx:0,dy:1}, s:{dx:0,dy:1}, S:{dx:0,dy:1},
  ArrowLeft:{dx:-1,dy:0}, a:{dx:-1,dy:0}, A:{dx:-1,dy:0},
  ArrowRight:{dx:1,dy:0}, d:{dx:1,dy:0}, D:{dx:1,dy:0},
};
let heldKey = null, moveTimer = null;

function peekRushEnergyMult() {
  const t = performance.now();
  const elapsed = t - lastActionTime;
  if (elapsed >= RUSH_SLOW_MS) return 1;
  const u = 1 - elapsed / RUSH_SLOW_MS;
  return 1 + u * (RUSH_MAX_MULT - 1);
}

function commitActionTime() {
  lastActionTime = performance.now();
}

function tryMove(key) {
  if (!gameActive) return;
  const dir = DIR[key]; if (!dir) return;
  const nx = player.x + dir.dx, ny = player.y + dir.dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
  if (dir.dx !== 0) player.facing = dir.dx > 0 ? 1 : 0;
  const cell = world[ny][nx];
  const def = BD[cell.type];
  if (!def[1]) {                          // not diggable
    if (cell.type === B.AIR) {
      player.x = nx; player.y = ny; player.steps++;
      commitActionTime();
    }
  } else {                                // diggable block
    if (energyDepleted && player.energy <= DIG_RECOVER_MIN) {
      player.eFlash = 0.5;
    } else {
      const mult = peekRushEnergyMult();
      const cost = Math.max(1, Math.ceil(def[2] * mult));
      if (player.energy >= cost) {
        player.energy -= cost;
        if (player.energy <= 0) {
          player.energy = 0;
          energyDepleted = true;
        }
        digBlock(nx, ny);
        player.x = nx; player.y = ny; player.steps++;
        commitActionTime();
      } else {
        player.eFlash = 0.5;               // flash energy bar red
      }
    }
  }
  maxDepth = Math.max(maxDepth, player.y - 1);
  updateCamTarget();
  updateHUD();
}

function digBlock(x, y) {
  const cell = world[y][x];
  const orig = cell.orig;
  cell.type = B.AIR;
  playDig(orig);
  spawnParts(x, y, orig);
  const found = rollTreasure(orig, y);
  if (found && found.id !== 'dirt') {
    score = Math.max(0, score + found.pts);
    if (!inv[found.id]) inv[found.id] = {t: found, count: 0};
    inv[found.id].count++;
    notif = found; notifAge = 0;
    playFind(found.r);
    if (found.r === 'legendary' || found.r === 'mythic' || found.r === 'cursed') {
      flash = 1; flashCol = RC[found.r];
    }
    updateSidebar();
  }
  updateHUD();
}

document.addEventListener('keydown', e => {
  if (!gameActive && DIR[e.key]) return;
  if (DIR[e.key]) {
    e.preventDefault();
    if (!heldKey) {
      heldKey = e.key;
      tryMove(e.key);
      moveTimer = setInterval(() => tryMove(heldKey), 130);
    }
  }
});
document.addEventListener('keyup', e => {
  if (e.key === heldKey) { heldKey = null; clearInterval(moveTimer); }
});
cvs.addEventListener('click', e => {
  if (!gameActive) return;
  const rect = cvs.getBoundingClientRect();
  const sx = cvs.width / rect.width, sy = cvs.height / rect.height;
  const cx = Math.floor((e.clientX - rect.left) * sx / BS);
  const cy = Math.floor(((e.clientY - rect.top) * sy / BS) + camY);
  const dx = cx - player.x, dy = cy - player.y;
  let key = null;
  if (Math.abs(dx) > Math.abs(dy)) key = dx > 0 ? 'ArrowRight' : 'ArrowLeft';
  else if (dy !== 0) key = dy > 0 ? 'ArrowDown' : 'ArrowUp';
  if (key) tryMove(key);
});

// ═══════════════════════════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════════════════════════
function spawnParts(bx, by, btype) {
  // Store in world-pixel space so they don't drift with camera
  const wpx = bx * BS + BS / 2, wpy = by * BS + BS / 2;
  const col = BD[btype]?.[3] || '#8a5425';
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2, spd = 0.7 + Math.random() * 2.8;
    parts.push({
      wx: wpx + (Math.random() - .5) * BS * .5,
      wy: wpy + (Math.random() - .5) * BS * .5,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1.6,
      life: 1, decay: .035 + Math.random() * .04,
      col, sz: 2 + Math.random() * 4.5,
    });
  }
}

function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.wx += p.vx; p.wy += p.vy; p.vy += 0.14; p.life -= p.decay;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════════════════════

// Rounded rect path helper
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h); c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r); c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

function drawBlock(col, row) {
  const cell = world[row][col];
  const def = BD[cell.type];
  const sx = col * BS, sy = Math.floor((row - camY) * BS);
  if (sy + BS < 0 || sy > CH) return;

  ctx.fillStyle = def[0]; ctx.fillRect(sx, sy, BS, BS);
  if (cell.type === B.AIR) return;

  // Procedural texture from pre-seeded variation
  const v = cell.v;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(sx + (v & 15) % 23,      sy + ((v>>4) & 15) % 23,      6, 3);
  ctx.fillRect(sx + ((v>>8) & 15) % 23, sy + ((v>>12) & 15) % 23,     3, 6);
  if (cell.type >= B.STONE) {
    ctx.fillRect(sx + ((v>>16) & 15) % 22, sy + ((v>>20) & 15) % 22,  7, 2);
    ctx.fillRect(sx + ((v>>24) & 7) % 24,  sy + ((v>>27) & 7) % 24,   2, 6);
  }
  // Bevel edges for subtle 3-D look
  ctx.fillStyle = 'rgba(255,255,255,.055)'; ctx.fillRect(sx, sy, BS, 2); ctx.fillRect(sx, sy, 2, BS);
  ctx.fillStyle = 'rgba(0,0,0,.32)';        ctx.fillRect(sx, sy+BS-2, BS, 2); ctx.fillRect(sx+BS-2, sy, 2, BS);
}

function drawSurface() {
  const surfY = Math.floor((0 - camY) * BS); // row 0 screen Y
  if (surfY > CH || surfY + BS < -20) return;
  // Sky above surface
  if (surfY > 0) {
    const sg = ctx.createLinearGradient(0, 0, 0, surfY);
    sg.addColorStop(0, '#1a3560'); sg.addColorStop(1, '#102040');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, CW, surfY);
  }
  // Ground surface strip (dark soil + grass)
  ctx.fillStyle = '#3a1e0a'; ctx.fillRect(0, surfY, CW, BS);
  ctx.fillStyle = '#2c6818'; ctx.fillRect(0, surfY, CW, 3);
  ctx.fillStyle = '#3a8020'; ctx.fillRect(0, surfY + 3, CW, 5);
  // Grass tufts
  if (surfY >= 4) {
    for (let c = 0; c < COLS; c++) {
      const h = 3 + (world[0][c].v % 4);
      ctx.fillStyle = '#4a9c28';
      [[3,0],[9,1],[16,0],[22,1],[26,0]].forEach(([ox,oy]) => {
        if (surfY - h + oy >= 0) ctx.fillRect(c*BS+ox, surfY-h+oy, 2, h-oy);
      });
    }
  }
}

function drawPlayer() {
  const bx = player.x * BS;
  const by = Math.floor((player.y - camY) * BS);
  if (by < -BS * 2 || by > CH + BS) return;

  ctx.save();
  // Mirror horizontally when facing left
  if (player.facing === 0) {
    ctx.translate(bx + BS / 2, 0); ctx.scale(-1, 1); ctx.translate(-(bx + BS / 2), 0);
  }

  const f = Math.floor(player.steps / 2) % 2; // walk animation frame (0 or 1)

  // Headlamp warm glow (drawn behind character)
  const gl = ctx.createRadialGradient(bx+22, by+4, 0, bx+22, by+4, 30);
  gl.addColorStop(0, 'rgba(255,210,90,.7)'); gl.addColorStop(1, 'rgba(255,210,90,0)');
  ctx.fillStyle = gl; ctx.fillRect(bx-2, by-10, BS + 16, 38);

  // Hard hat
  ctx.fillStyle = '#f0b800'; ctx.fillRect(bx+4, by+1, 22, 7);
  ctx.fillRect(bx+2, by+7, 26, 3); // brim
  // Headlamp lens
  ctx.fillStyle = '#fffff0'; ctx.fillRect(bx+20, by+2, 5, 4);
  ctx.fillStyle = '#fff5a0'; ctx.fillRect(bx+21, by+3, 3, 2);

  // Face
  ctx.fillStyle = '#c8905c'; ctx.fillRect(bx+5, by+10, 20, 7);
  ctx.fillStyle = '#282018'; ctx.fillRect(bx+8, by+12, 3, 3); ctx.fillRect(bx+19, by+12, 3, 3);

  // Shirt / body
  ctx.fillStyle = '#1550c0'; ctx.fillRect(bx+5, by+17, 20, 8);
  // Arms
  ctx.fillStyle = '#c8905c';
  ctx.fillRect(bx+2,  by+18, 4, f ? 7 : 6);  // left arm
  ctx.fillRect(bx+24, by+18, 4, f ? 6 : 7);  // right arm (holding tool)

  // Pickaxe handle + blade
  ctx.fillStyle = '#7a4a20'; ctx.fillRect(bx+27, by+17, 3, 12);
  ctx.fillStyle = '#909098'; ctx.fillRect(bx+25, by+14, 10, 5);
  ctx.fillStyle = '#b8b8c0'; ctx.fillRect(bx+25, by+14, 5, 3); // shine

  // Legs (walking animation)
  ctx.fillStyle = '#50341c';
  if (f === 0) {
    ctx.fillRect(bx+5,  by+25, 9, 6); ctx.fillRect(bx+16, by+25, 9, 6);
  } else {
    ctx.fillRect(bx+5,  by+24, 9, 7); ctx.fillRect(bx+16, by+26, 9, 5);
  }
  // Boots
  ctx.fillStyle = '#281408'; ctx.fillRect(bx+4, by+30, 11, 3); ctx.fillRect(bx+15, by+30, 11, 3);

  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    const sx = p.wx, sy = p.wy - camY * BS;
    ctx.fillRect(sx - p.sz/2, sy - p.sz/2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

function drawLighting() {
  const px = (player.x + .5) * BS;
  const py = Math.floor((player.y - camY + .5) * BS);

  lCtx.clearRect(0, 0, CW, CH);
  lCtx.fillStyle = 'rgba(0,0,0,.97)'; lCtx.fillRect(0, 0, CW, CH);
  lCtx.globalCompositeOperation = 'destination-out';
  const g = lCtx.createRadialGradient(px, py, 0, px, py, LIGHT_R);
  g.addColorStop(0,    'rgba(0,0,0,1)');
  g.addColorStop(0.42, 'rgba(0,0,0,.96)');
  g.addColorStop(0.70, 'rgba(0,0,0,.6)');
  g.addColorStop(0.87, 'rgba(0,0,0,.18)');
  g.addColorStop(1,    'rgba(0,0,0,0)');
  lCtx.fillStyle = g; lCtx.fillRect(0, 0, CW, CH);
  lCtx.globalCompositeOperation = 'source-over';
  ctx.drawImage(lCvs, 0, 0);

  // Warm torch-colour tint over lit area
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const wg = ctx.createRadialGradient(px, py, 0, px, py, LIGHT_R * .75);
  wg.addColorStop(0, 'rgba(255,170,50,.07)'); wg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, CW, CH);
  ctx.restore();
}

function drawNotification(dt) {
  if (!notif) return;
  notifAge += dt;
  if (notifAge > 3) { notif = null; return; }
  const alpha = Math.min(notifAge / .25, 1) * Math.min((3 - notifAge) / .35, 1);
  const t = notif;
  const w = 172, h = 55, x = CW - w - 8, y = 10;
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(ctx, x+2, y+2, w, h, 9); ctx.fill();
  // Background + border
  ctx.fillStyle = '#140900'; ctx.strokeStyle = RC[t.r]; ctx.lineWidth = 2;
  rr(ctx, x, y, w, h, 9); ctx.fill(); ctx.stroke();
  // SVG image
  const img = IMGS[t.id];
  if (img && img.complete) ctx.drawImage(img, x+7, y+7, 41, 41);
  // Text
  ctx.font = '9px monospace'; ctx.fillStyle = RC[t.r]; ctx.fillText(t.r.toUpperCase(), x+54, y+20);
  ctx.font = 'bold 13px Georgia'; ctx.fillStyle = '#f0c040'; ctx.fillText(t.name, x+54, y+35);
  ctx.font = '11px Georgia';
  ctx.fillStyle = t.pts >= 0 ? '#66bb6a' : '#ef5350';
  ctx.fillText(t.pts >= 0 ? `+${t.pts} pts` : `${t.pts} pts`, x+54, y+49);
  ctx.restore();
}

function drawScreenFlash(dt) {
  if (flash <= 0) return;
  ctx.save();
  ctx.globalAlpha = flash * 0.28;
  ctx.fillStyle = flashCol; ctx.fillRect(0, 0, CW, CH);
  ctx.restore();
  flash = Math.max(0, flash - dt * 3.5);
}

// ═══════════════════════════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════════════════════════
function updateCamTarget() {
  const ideal = player.y - Math.floor(VR * 0.38);
  camTarget = Math.max(-0.5, Math.min(ROWS - VR, ideal));
}

function formatTime(s) {
  const sec = Math.max(0, Math.ceil(s));
  const m = Math.floor(sec / 60), r = sec % 60;
  return `${m}:${r.toString().padStart(2, '0')}`;
}

function endGame(reason) {
  if (!gameActive) return;
  gameActive = false;
  heldKey = null;
  if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
  timeLeft = Math.max(0, timeLeft);
  const depth = Math.max(0, player.y - 1);
  const nFound = Object.values(inv).reduce((n, x) => n + x.count, 0);
  document.getElementById('go-reason').textContent = reason;
  document.getElementById('go-score').textContent = score.toLocaleString();
  document.getElementById('go-detail').textContent =
    `${depth}m deepest · ${nFound} treasure${nFound !== 1 ? 's' : ''} found`;
  document.getElementById('gameover').classList.add('show');
  updateHUD();
}

// ═══════════════════════════════════════════════════════════════════════════════
// HUD / SIDEBAR
// ═══════════════════════════════════════════════════════════════════════════════
function updateHUD() {
  const depth = Math.max(0, player.y - 1);
  document.getElementById('hud-depth').textContent = depth === 0 ? 'Surface' : `${depth}m deep`;

  const tv = document.getElementById('timer-val');
  tv.textContent = formatTime(timeLeft);
  tv.classList.remove('warn', 'crit');
  if (gameActive) {
    if (timeLeft <= 10) tv.classList.add('crit');
    else if (timeLeft <= 30) tv.classList.add('warn');
  }

  const pct = player.energy / player.maxEnergy;
  const fill = document.getElementById('energy-fill');
  fill.style.width = `${pct * 100}%`;
  if (player.eFlash > 0) {
    fill.style.background = 'linear-gradient(90deg,#901010,#c82020)';
    document.getElementById('energy-bar').style.boxShadow = '0 0 9px rgba(200,30,30,.75)';
  } else {
    document.getElementById('energy-bar').style.boxShadow = '';
    if      (pct > .6) fill.style.background = 'linear-gradient(90deg,#e08020,#f0c040)';
    else if (pct > .3) fill.style.background = 'linear-gradient(90deg,#c04010,#e07020)';
    else               fill.style.background = 'linear-gradient(90deg,#901010,#c83020)';
  }
  document.getElementById('energy-text').textContent = `${player.energy}/${player.maxEnergy}`;
  document.getElementById('score-val').textContent = score.toLocaleString();
  document.getElementById('score-sub').textContent = `Depth: ${depth}m  ·  Best: ${maxDepth}m`;

  const layer = LAYERS.find(l => depth < l.maxRow) || LAYERS.at(-1);
  document.getElementById('layer-name').textContent = layer.name;
  document.getElementById('layer-name').style.color = layer.color;
  document.getElementById('layer-desc').textContent = layer.desc;
}

function updateSidebar() {
  const el = document.getElementById('discoveries');
  el.innerHTML = '';
  const sorted = Object.values(inv).sort((a, b) => b.t.pts - a.t.pts);
  if (sorted.length === 0) {
    el.innerHTML = '<div id="empty-disc">Nothing found yet…</div>';
    return;
  }
  for (const {t, count} of sorted) {
    const item = document.createElement('div'); item.className = 'disc-item';
    const icon = document.createElement('div'); icon.className = 'disc-icon';
    const img  = document.createElement('img'); img.src = `./svg/${t.id}.svg`; img.alt = t.name;
    icon.appendChild(img);
    const name = document.createElement('div'); name.className = `disc-name rc-${t.r}`; name.textContent = t.name;
    const cnt  = document.createElement('div'); cnt.className = 'disc-count'; cnt.textContent = `×${count}`;
    item.appendChild(icon); item.appendChild(name); item.appendChild(cnt);
    el.appendChild(item);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════════════════════
function loop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, .05); lastTs = ts;

  // Smooth camera follow
  camY += (camTarget - camY) * Math.min(dt * 7, 1);

  if (gameActive) {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      endGame("Time's up — expedition ends.");
    }
  }

  // Energy regeneration (slow; digging costs are high)
  if (gameActive && player.energy < player.maxEnergy) {
    energyAcc += dt * ENERGY_REGEN_PER_SEC;
    const regen = Math.floor(energyAcc);
    if (regen > 0) {
      player.energy = Math.min(player.maxEnergy, player.energy + regen);
      energyAcc -= regen;
      if (energyDepleted && player.energy > DIG_RECOVER_MIN) energyDepleted = false;
      updateHUD();
    }
  }
  if (player.eFlash > 0) { player.eFlash -= dt; if (player.eFlash <= 0) updateHUD(); }

  updateParts(dt);

  // ── Draw ──
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = '#0d0700'; ctx.fillRect(0, 0, CW, CH); // underground bg

  drawSurface();

  // Visible block range
  const r0 = Math.max(1, Math.floor(camY) - 1);
  const r1 = Math.min(ROWS - 1, Math.ceil(camY + VR) + 1);
  for (let row = r0; row <= r1; row++)
    for (let col = 0; col < COLS; col++)
      drawBlock(col, row);

  drawPlayer();
  drawParticles();
  drawLighting();       // darkness overlay
  drawScreenFlash(dt);  // legendary/cursed colour burst
  drawNotification(dt); // treasure card (drawn on top of lighting)

  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════════
function initGame() {
  gameActive = true;
  timeLeft = ROUND_TIME_SEC;
  heldKey = null;
  if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
  document.getElementById('gameover').classList.remove('show');

  score = 0; inv = {}; maxDepth = 0;
  player = { x:10, y:1, energy:221, maxEnergy:221, steps:0, facing:1, eFlash:0 };
  camY = -0.5; camTarget = -0.5;
  parts = []; notif = null; notifAge = 0; flash = 0; energyAcc = 0;
  lastActionTime = -1e9;
  energyDepleted = false;
  genWorld();
  updateHUD();
  updateSidebar();
}

document.getElementById('new-game-btn').addEventListener('click', initGame);
document.getElementById('go-btn').addEventListener('click', initGame);

initGame();
requestAnimationFrame(loop);
</script>
